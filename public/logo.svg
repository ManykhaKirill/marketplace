<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amberGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="96" height="96" rx="20" fill="white"/>

  <!-- Grid container -->
  <g transform="translate(18,18)">
    
    <!-- Cells -->
    <!-- Row 1 -->
    <rect x="0"  y="0"  width="16" height="16" rx="5" fill="#E5E7EB"/>
    <rect x="22" y="0"  width="16" height="16" rx="5" fill="#E5E7EB"/>
    <rect x="44" y="0"  width="16" height="16" rx="5" fill="#E5E7EB"/>

    <!-- Row 2 -->
    <rect x="0"  y="22" width="16" height="16" rx="5" fill="#E5E7EB"/>
    <rect x="22" y="22" width="16" height="16" rx="5" fill="url(#amberGradient)"/>
    <rect x="44" y="22" width="16" height="16" rx="5" fill="#E5E7EB"/>

    <!-- Row 3 -->
    <rect x="0"  y="44" width="16" height="16" rx="5" fill="#E5E7EB"/>
    <rect x="22" y="44" width="16" height="16" rx="5" fill="#E5E7EB"/>
    <rect x="44" y="44" width="16" height="16" rx="5" fill="#E5E7EB"/>

  </g>
</svg>